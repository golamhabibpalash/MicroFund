<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2a3a"/>
      <stop offset="1" stop-color="#0d4f4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="1" stop-color="#0a1726"/>
    </linearGradient>
    <linearGradient id="towerFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14394a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0c2230" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#5eead4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="windows" width="18" height="22" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="7" height="9" rx="1" fill="#99f6e4" fill-opacity="0.14"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#sky)"/>
  <rect width="1600" height="640" fill="url(#glow)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <!-- Distant skyline -->
  <g fill="url(#towerFar)">
    <rect x="40" y="380" width="70" height="260"/>
    <rect x="120" y="330" width="56" height="310"/>
    <rect x="190" y="410" width="90" height="230"/>
    <rect x="520" y="360" width="64" height="280"/>
    <rect x="600" y="300" width="48" height="340"/>
    <rect x="920" y="350" width="80" height="290"/>
    <rect x="1010" y="400" width="60" height="240"/>
    <rect x="1330" y="320" width="70" height="320"/>
    <rect x="1410" y="380" width="96" height="260"/>
    <rect x="1520" y="340" width="60" height="300"/>
  </g>

  <!-- Candlesticks -->
  <g stroke-width="2" stroke-linecap="round" opacity="0.55">
    <g stroke="#5eead4" fill="#5eead4" fill-opacity="0.35">
      <line x1="760" y1="300" x2="760" y2="380"/><rect x="752" y="318" width="16" height="44" rx="2"/>
      <line x1="840" y1="262" x2="840" y2="352"/><rect x="832" y="280" width="16" height="52" rx="2"/>
      <line x1="1000" y1="208" x2="1000" y2="300"/><rect x="992" y="224" width="16" height="56" rx="2"/>
      <line x1="1160" y1="160" x2="1160" y2="250"/><rect x="1152" y="174" width="16" height="58" rx="2"/>
      <line x1="1320" y1="110" x2="1320" y2="200"/><rect x="1312" y="124" width="16" height="56" rx="2"/>
    </g>
    <g stroke="#fca5a5" fill="#fca5a5" fill-opacity="0.25">
      <line x1="920" y1="236" x2="920" y2="330"/><rect x="912" y="252" width="16" height="50" rx="2"/>
      <line x1="1080" y1="196" x2="1080" y2="276"/><rect x="1072" y="210" width="16" height="44" rx="2"/>
      <line x1="1240" y1="150" x2="1240" y2="232"/><rect x="1232" y="164" width="16" height="44" rx="2"/>
    </g>
  </g>

  <!-- Growth chart -->
  <path d="M0 470 C140 455 220 430 320 420 S500 390 600 360 S760 330 860 300 S1020 260 1120 220 S1300 150 1420 110 L1600 70 L1600 640 L0 640 Z" fill="url(#area)"/>
  <path d="M0 470 C140 455 220 430 320 420 S500 390 600 360 S760 330 860 300 S1020 260 1120 220 S1300 150 1420 110 L1600 70" fill="none" stroke="#5eead4" stroke-width="10" stroke-opacity="0.25" filter="url(#soft)"/>
  <path d="M0 470 C140 455 220 430 320 420 S500 390 600 360 S760 330 860 300 S1020 260 1120 220 S1300 150 1420 110 L1600 70" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#0b1220" stroke="#5eead4" stroke-width="3">
    <circle cx="600" cy="360" r="6"/>
    <circle cx="860" cy="300" r="6"/>
    <circle cx="1120" cy="220" r="6"/>
  </g>
  <circle cx="1420" cy="110" r="9" fill="#fde68a"/>
  <circle cx="1420" cy="110" r="22" fill="#fde68a" fill-opacity="0.18"/>

  <!-- Foreground skyline -->
  <g fill="url(#tower)">
    <rect x="0" y="500" width="120" height="140"/>
    <rect x="130" y="450" width="80" height="190"/>
    <polygon points="220,640 220,420 260,390 300,420 300,640"/>
    <rect x="310" y="470" width="110" height="170"/>
    <rect x="430" y="400" width="70" height="240"/>
    <rect x="505" y="520" width="120" height="120"/>
    <rect x="640" y="460" width="90" height="180"/>
    <rect x="740" y="500" width="140" height="140"/>
    <rect x="890" y="430" width="74" height="210"/>
    <polygon points="975,640 975,450 1015,420 1055,450 1055,640"/>
    <rect x="1065" y="490" width="130" height="150"/>
    <rect x="1205" y="440" width="84" height="200"/>
    <rect x="1300" y="510" width="120" height="130"/>
    <rect x="1430" y="460" width="90" height="180"/>
    <rect x="1530" y="500" width="70" height="140"/>
  </g>
  <g fill="url(#windows)">
    <rect x="130" y="462" width="80" height="178"/>
    <rect x="430" y="412" width="70" height="228"/>
    <rect x="640" y="472" width="90" height="168"/>
    <rect x="890" y="442" width="74" height="198"/>
    <rect x="1205" y="452" width="84" height="188"/>
    <rect x="1430" y="472" width="90" height="168"/>
  </g>
</svg>
