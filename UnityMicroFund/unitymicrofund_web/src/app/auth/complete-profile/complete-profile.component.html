<div class="complete-profile-wrapper">
  <div class="complete-profile-container">

    <div class="cp-header">
      <img src="assets/organization/logo.png" alt="UnityMicroFund" class="logo-img" />
      <p>Complete Your Member Profile</p>
    </div>

    <div *ngIf="state === 'success'" class="cp-message success">
      <div class="success-icon">&#10003;</div>
      <h3>Submission Successful!</h3>
      <p>{{ submitMessage }}</p>
      <p class="redirect-note">Redirecting to login page...</p>
      <button type="button" class="btn-primary" (click)="goToLogin()">Go to Login</button>
    </div>

    <ng-container *ngIf="state === 'form'">
      <p class="cp-intro">Please fill in your details below. An admin will review and approve your membership.</p>

      <div class="alert-message error" *ngIf="error">{{ error }}</div>

      <form [formGroup]="form" class="cp-form">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" formControlName="name" class="form-control" placeholder="Your full name" />
        </div>

        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" formControlName="phone" class="form-control" placeholder="e.g. 01712345678" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date of Birth *</label>
            <input type="date" formControlName="dateOfBirth" class="form-control" />
          </div>
          <div class="form-group">
            <label>Gender *</label>
            <select formControlName="gender" class="form-control">
              <option value="">Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Nationality *</label>
            <input type="text" formControlName="nationality" class="form-control" placeholder="Nationality" />
          </div>
          <div class="form-group">
            <label>Occupation *</label>
            <input type="text" formControlName="occupation" class="form-control" placeholder="Occupation" />
          </div>
        </div>

        <div class="form-group">
          <label>Address *</label>
          <input type="text" formControlName="address" class="form-control" placeholder="Your address" />
        </div>

        <div class="form-group">
          <label>Monthly Contribution Amount *</label>
          <input type="number" formControlName="monthlyAmount" class="form-control" placeholder="0.00" min="0" />
        </div>

        <div class="form-group">
          <label>Bank Name *</label>
          <input type="text" formControlName="bankName" class="form-control" placeholder="Bank name" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Account Holder Name *</label>
            <input type="text" formControlName="accountHolderName" class="form-control" placeholder="Account holder" />
          </div>
          <div class="form-group">
            <label>Account Number *</label>
            <input type="text" formControlName="accountNumber" class="form-control" placeholder="Account number" />
          </div>
        </div>

        <div class="form-group">
          <label>Nominee Name *</label>
          <input type="text" formControlName="nomineeName" class="form-control" placeholder="Nominee name" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Nominee Phone *</label>
            <input type="tel" formControlName="nomineePhone" class="form-control" placeholder="Nominee phone" />
          </div>
          <div class="form-group">
            <label>Emergency Contact Phone *</label>
            <input type="tel" formControlName="emergencyContactPhone" class="form-control" placeholder="Emergency phone" />
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" formControlName="acceptTerms" />
          <span>I confirm the information is accurate and accept the terms *</span>
        </label>

        <button type="button" class="btn-primary" (click)="submit()" [disabled]="form.invalid">
          Submit for Approval
        </button>
      </form>
    </ng-container>

    <div *ngIf="state === 'submitting'" class="cp-message loading">
      <div class="spinner"></div>
      <p>Submitting your profile... Please wait.</p>
    </div>

    <div *ngIf="state === 'error'" class="cp-message error-state">
      <h3>Submission Failed</h3>
      <p>{{ error }}</p>
      <button type="button" class="btn-primary" (click)="state = 'form'">Try Again</button>
    </div>

  </div>
</div>
