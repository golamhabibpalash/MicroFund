<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance — Unity MicroFund</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
      padding: 2rem;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.02em;
    }

    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 1.75rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 0.5rem;
    }

    .badge {
      display: inline-block;
      margin-top: 1.75rem;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.35);
      color: #a5b4fc;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .contact {
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.82rem;
      color: #64748b;
    }

    .contact a {
      color: #818cf8;
      text-decoration: none;
    }

    .contact a:hover { text-decoration: underline; }

    .dots {
      display: inline-flex;
      gap: 5px;
      vertical-align: middle;
      margin-left: 4px;
    }

    .dots span {
      width: 5px;
      height: 5px;
      background: #6366f1;
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%           { transform: scale(1);   opacity: 1;   }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">&#x1F4B0;</div>
      <span class="logo-text">Unity MicroFund</span>
    </div>

    <div class="spinner"></div>

    <h1>Under Maintenance</h1>
    <p>We're deploying an update to improve your experience.<div class="dots"><span></span><span></span><span></span></div></p>
    <p>The app will be back online in a few minutes.</p>

    <div class="badge">&#x2699;&#xFE0F; Deployment in progress</div>

    <div class="contact">
      Need help? Contact us at
      <a href="mailto:unitymicrofund@gmail.com">unitymicrofund@gmail.com</a>
    </div>
  </div>
</body>
</html>
